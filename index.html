<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="hero-container">
        <div id="hero-base">
            <div id="hero">
                <header>~ Redlight, Greenlight ~</header>
            </div>
        </div>
        <div id="day-night">
            <button id="day-switch" class="day-night-button">
                <img class="day-night-img" src="stoplightImage/moon.png" alt="day/night">
            </button>
        </div>
    </div>
    <div class="main-page-container">
        <div class="rules-container">
            <img src="stoplightImage/rules-sheet.png" alt="rules" class="rules-sheet">
        </div>

        <div class="traffic-light-container">
            <div class="sun-moon-container">
                <div class="sun-container">
                    <img src="stoplightImage/sun.png" alt="Sun Image" class="sun-image">
                </div>
                <div class="moon-container">
                    <img src="stoplightImage/moon.png" alt="Moon Image" class="moon-image">
                </div>
            </div>
            <div class="traffic-light-image">
                <img src="stoplightImage/trafficlight2.png" alt="Traffic Light" class="bg-image">
                <div class="streetlight-glow"></div>
                <div class="streetlight-spill"></div>
            </div>
    
            <div class="lights">
                <div class="red-light">
                    <div class="red-lens-container">
                        <img src="stoplightImage/light-lens.jpg" alt="lens" class="red-light-lens">
                    </div>
                <span></span>
                </div>
                <div class="yellow-light">
                    <div class="yellow-lens-container">
                        <img src="stoplightImage/light-lens.jpg" alt="lens" class="yellow-light-lens">
                    </div>
                    <span></span>
                </div>
                <div class="green-light">
                    <div class="green-lens-container">
                        <img src="stoplightImage/light-lens.jpg" alt="lens" class="green-light-lens">
                    </div>
                    <span></span>
                </div>
            </div>
        </div>
        <div id="countdown-timer">

            <div class="timer-box">
                <div id="tens" class="seven-segment">
                    <span class="segment top"></span>
                    <span class="segment upper-left"></span>
                    <span class="segment upper-right"></span>
                    <span class="segment middle"></span>
                    <span class="segment bottom-left"></span>
                    <span class="segment bottom-right"></span>
                    <span class="segment bottom"></span>
                </div>

                <div id="ones" class="seven-segment">
                    <span class="segment top"></span>
                    <span class="segment upper-left"></span>
                    <span class="segment upper-right"></span>
                    <span class="segment middle"></span>
                    <span class="segment bottom-left"></span>
                    <span class="segment bottom-right"></span>
                    <span class="segment bottom"></span>
                </div>

                <div class="digit-dot">
                    <span class="dot"></span>
                </div>

                <div id="milliseconds" class="seven-segment">
                    <span class="segment top"></span>
                    <span class="segment upper-left"></span>
                    <span class="segment upper-right"></span>
                    <span class="segment middle"></span>
                    <span class="segment bottom-left"></span>
                    <span class="segment bottom-right"></span>
                    <span class="segment bottom"></span>
                </div>
            </div>
        </div>
    </div>

    <div id="buttons-container">
        <div id="red-container">
            <button id="red-button" class="control-button">
                <img src="stoplightImage/redLight.png" alt="Red Light" class="red-light-img">
            </button>
            
        </div>
        <div id="yellow-container">
            <button id="yellow-button" class="control-button">
                <img src="stoplightImage/yellowLight.png" alt="Yellow Light" class="yellow-light-img">
            </button>
            
        </div>
        <div id="green-container">
            <button id="green-button" class="control-button">
                <img src="stoplightImage/greenLight.png" alt="Green Light" class="green-light-img">
            </button>
            
        </div>
    </div>
</body>
</html>

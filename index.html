<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="hero">
        <header>~ Redlight, Greenlight ~</header>
    </div>
    <div class="traffic-light-container">
        <img src="stoplightImage/trafficlight.jpg" alt="Traffic Light" class="bg-image">
    
        <div class="lights">
            <div class="red-light">
                <span></span>
            </div>
            <div class="yellow-light">
                <span></span>
            </div>
            <div class="green-light">
                <span></span>
            </div>
        </div>
    </div>
    <div id="countdown-timer">

        <div class="timer-box">
            <div id="tens" class="seven-segment">
                <span class="top"></span>
                <span class="upper-left"></span>
                <span class="upper-right"></span>
                <span class="middle"></span>
                <span class="bottom-left"></span>
                <span class="bottom-right"></span>
                <span class="bottom"></span>
            </div>

            <div id="ones" class="seven-segment">
                <span class="top"></span>
                <span class="upper-left"></span>
                <span class="upper-right"></span>
                <span class="middle"></span>
                <span class="bottom-left"></span>
                <span class="bottom-right"></span>
                <span class="bottom"></span>
            </div>

            <div id="dot">
                <span class="dot"></span>
            </div>

            <div id="tenths" class="seven-segment">
                <span class="top"></span>
                <span class="upper-left"></span>
                <span class="upper-right"></span>
                <span class="middle"></span>
                <span class="bottom-left"></span>
                <span class="bottom-right"></span>
                <span class="bottom"></span>
            </div>
        </div>
    </div>
    <div id="buttons">
        <button id="red-button">RED</button>
        <button id="yellow-button">YELLOW</button>
        <button id="green-button">GREEN</button>
    </div>
</body>
</html>
